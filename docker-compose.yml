services:

  postgis:
    image: postgis/postgis:16-3.4
    container_name: rov_postgis
    environment:
      POSTGRES_DB: rovdb
      POSTGRES_USER: rovadmin
      POSTGRES_PASSWORD: rovpassword
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rovadmin -d rovdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  geoserver:
    image: kartoza/geoserver:2.24.0
    container_name: rov_geoserver
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: geoserver
      GEOSERVER_DATA_DIR: /opt/geoserver/data_dir
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "*"
      CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,HEAD,OPTIONS"
      CORS_ALLOWED_HEADERS: "*"
    volumes:
      - geoserver_data:/opt/geoserver/data_dir
    depends_on:
      postgis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: rov_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - geoserver

  ingestion:
    build: ./ingestion
    container_name: rov_ingestion
    volumes:
      - ~/rov-gis/Data:/data
    depends_on:
      postgis:
        condition: service_healthy

volumes:
  postgis_data:
  geoserver_data:
