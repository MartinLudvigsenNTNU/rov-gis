<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>ROV/AUV GIS Demonstrator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; }
        #title {
            position: absolute;
            top: 10px;
            left: 50px;
            z-index: 1000;
            background: white;
            padding: 8px 15px;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="title">🌊 ROV/AUV GIS Demonstrator – NTNU</div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([63.441, 10.348], 14);

        var cartoLight = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap © CARTO', maxZoom: 19
        });
        var cartoDark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap © CARTO', maxZoom: 19
        });
        var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: '© Esri World Imagery', maxZoom: 19
        });
        var gebco = L.tileLayer.wms('https://wms.gebco.net/mapserv?', {
            layers: 'GEBCO_LATEST', format: 'image/png',
            transparent: false, attribution: '© GEBCO 2024'
        });
        var kartverketTopo = L.tileLayer(
            'https://cache.kartverket.no/v1/wmts/1.0.0/topo/default/webmercator/{z}/{y}/{x}.png',
            { attribution: '© Kartverket', maxZoom: 18 }
        );
        var kartverketGraatone = L.tileLayer(
            'https://cache.kartverket.no/v1/wmts/1.0.0/topograatone/default/webmercator/{z}/{y}/{x}.png',
            { attribution: '© Kartverket', maxZoom: 18 }
        );
        var emodnetBathy = L.tileLayer.wms('https://ows.emodnet-bathymetry.eu/wms', {
            layers: 'emodnet:mean_atlas_land', format: 'image/png',
            transparent: true, attribution: '© EMODnet', opacity: 0.7
        });

        cartoDark.addTo(map);

        var baseMaps = {
            "Kart (lyst)": cartoLight,
            "Kart (mørkt)": cartoDark,
            "Satellitt (Esri)": satellite,
            "GEBCO Batymetri": gebco,
            "Norgeskart": kartverketTopo,
            "Norgeskart (gråtone)": kartverketGraatone,
        };

        var overlayMaps = {
            "EMODnet Batymetri": emodnetBathy,
        };

        var layerControl = L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);
        L.control.scale({ imperial: false }).addTo(map);

        // Hent lag dynamisk fra GeoServer
        fetch('/geoserver/rest/layers.json', {
            headers: { 'Authorization': 'Basic ' + btoa('admin:geoserver') }
        })
        .then(r => r.json())
        .then(data => {
            (data.layers.layer || []).forEach(layer => {
                var parts = layer.name.split(':');
                var workspace = parts[0];
                var layerName = parts[1] || parts[0];
                var wmsLayer = L.tileLayer.wms('/geoserver/' + workspace + '/wms', {
                    layers: layerName,
                    format: 'image/png',
                    transparent: true,
                    attribution: 'NTNU ROV/AUV GIS'
                });
                layerControl.addOverlay(wmsLayer, layer.name);
            });
        })
        .catch(err => console.warn('Kunne ikke hente GeoServer-lag:', err));

    </script>
</body>
</html>
