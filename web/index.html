<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>AUV ops AT-334</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-groupedlayercontrol/dist/leaflet.groupedlayercontrol.min.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"/>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; }
        #title {
            position: absolute;
            top: 10px;
            left: 50px;
            z-index: 1000;
            background: white;
            padding: 8px 15px;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-size: 14px;
            font-weight: bold;
        }
        .leaflet-control-layers-group-label {
            cursor: pointer;
            user-select: none;
        }
        .group-arrow {
            float: right;
            font-size: 10px;
            color: #666;
            margin-left: 6px;
            transition: transform 0.15s ease;
            pointer-events: none;
        }

        /* --- Søkepanel --- */
        #search-toggle {
            position: absolute;
            top: 10px;
            left: 210px;
            z-index: 1001;
            background: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-size: 13px;
            cursor: pointer;
        }
        #search-panel {
            position: absolute;
            top: 50px;
            left: 50px;
            z-index: 1000;
            background: white;
            padding: 14px;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            width: 300px;
            font-size: 13px;
            display: none;
        }
        #search-panel h3 {
            margin: 0 0 10px;
            font-size: 14px;
        }
        .sp-row {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            align-items: center;
        }
        .sp-row label {
            flex: 0 0 32px;
            color: #555;
        }
        .sp-row input[type=date] {
            flex: 1;
            padding: 4px 6px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 12px;
        }
        #rect-status {
            font-size: 11px;
            color: #888;
            margin-bottom: 8px;
            min-height: 16px;
        }
        .sp-btn-row {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }
        .sp-btn {
            flex: 1;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 3px;
            background: #f5f5f5;
            cursor: pointer;
            font-size: 12px;
        }
        .sp-btn:hover { background: #e8e8e8; }
        .sp-btn.primary {
            background: #2277cc;
            color: white;
            border-color: #1a5fa0;
        }
        .sp-btn.primary:hover { background: #1a5fa0; }
        #search-results {
            max-height: 320px;
            overflow-y: auto;
            border-top: 1px solid #eee;
            padding-top: 8px;
            margin-top: 4px;
        }
        #result-count {
            font-size: 11px;
            color: #666;
            margin-bottom: 6px;
        }
        .result-item {
            padding: 6px 0;
            border-bottom: 1px solid #f0f0f0;
            line-height: 1.4;
        }
        .result-item:last-child { border-bottom: none; }
        .result-item strong { font-size: 12px; }
        .result-item .meta { font-size: 11px; color: #777; }
        .result-item .path {
            font-family: monospace;
            font-size: 10px;
            color: #444;
            word-break: break-all;
        }
        #btn-export { width: 100%; margin-top: 8px; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="title">AUV ops AT-334</div>
    <button id="search-toggle">Søk i tokter ▼</button>

    <div id="search-panel">
        <h3>Søk i tokter</h3>

        <div class="sp-btn-row">
            <button class="sp-btn" id="btn-draw">✏ Tegn rektangel</button>
            <button class="sp-btn" id="btn-clear-rect">✕ Fjern</button>
        </div>
        <div id="rect-status">Ingen rektangel tegnet</div>

        <div class="sp-row">
            <label>Fra</label>
            <input type="date" id="date-from">
        </div>
        <div class="sp-row">
            <label>Til</label>
            <input type="date" id="date-to">
        </div>

        <div class="sp-btn-row">
            <button class="sp-btn primary" id="btn-search">Søk</button>
            <button class="sp-btn" id="btn-clear-all">Nullstill</button>
        </div>

        <div id="search-results" style="display:none">
            <div id="result-count"></div>
            <div id="result-list"></div>
            <button class="sp-btn" id="btn-export" style="display:none">
                Eksporter CSV
            </button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-groupedlayercontrol/dist/leaflet.groupedlayercontrol.min.js"></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
    <script src="https://unpkg.com/proj4@2.9.0/dist/proj4.js"></script>
    <script src="https://unpkg.com/proj4leaflet@1.0.2/src/proj4leaflet.js"></script>
    <script>
        // EPSG:25833 — UTM sone 33N (NPI sitt native koordinatsystem for Svalbard)
        // Resolusjoner og origin fra NPI WMTS capabilities (default028mm tile matrix)
        var crs25833 = new L.Proj.CRS(
            'EPSG:25833',
            '+proj=utm +zone=33 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs',
            {
                origin: [-5120900.0, 9998100.0],
                resolutions: [
                    21674.710016083973, 10837.355008041986, 5418.677504020993,
                    2709.3387520104966, 1354.6693760052483, 677.3346880026241,
                    338.6673440013121,  169.33367200065604, 84.66683600032802,
                    42.33341800016401,  21.166709000082005, 10.583354500041002,
                    5.291677250020501,  2.6458386250102506, 1.3229193125051253,
                    0.6614596562525626, 0.3307298281262813, 0.16536491406314066
                ]
            }
        );

        var map = L.map('map', { crs: crs25833 }).setView([78.2, 15.5], 5);

        // NPI Svalbard basiskart — native WMTS i EPSG:25833, ingen reprosjeksjon
        var npiSvalbard = L.tileLayer(
            'https://geodata.npolar.no/arcgis/rest/services/Basisdata/NP_Basiskart_Svalbard_WMTS_25833/MapServer/tile/{z}/{y}/{x}',
            { attribution: '© Norsk Polarinstitutt', maxZoom: 17, minZoom: 0 }
        );

        // WMS-lag fungerer med EPSG:25833 via server-side reprosjeksjon
        var satellite = L.tileLayer.wms(
            'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/WmsServer', {
                layers: '0', format: 'image/png',
                transparent: false, attribution: '© Esri World Imagery'
            }
        );
        var gebco = L.tileLayer.wms('https://wms.gebco.net/mapserv?', {
            layers: 'GEBCO_LATEST', format: 'image/png',
            transparent: false, attribution: '© GEBCO 2024'
        });
        var kartverketTopo = L.tileLayer.wms(
            'https://openwms.statkart.no/skwms1/wms.topo4', {
                layers: 'topo4_WMS', format: 'image/png',
                transparent: false, attribution: '© Kartverket'
            }
        );
        var kartverketGraatone = L.tileLayer.wms(
            'https://openwms.statkart.no/skwms1/wms.topo4', {
                layers: 'topo4graatone_WMS', format: 'image/png',
                transparent: false, attribution: '© Kartverket'
            }
        );
        var emodnetBathy = L.tileLayer.wms('https://ows.emodnet-bathymetry.eu/wms', {
            layers: 'emodnet:mean_atlas_land', format: 'image/png',
            transparent: true, attribution: '© EMODnet', opacity: 0.7
        });

        npiSvalbard.addTo(map);

        var baseMaps = {
            "Svalbard topo (NPI)": npiSvalbard,
            "Satellitt (Esri)": satellite,
            "GEBCO Batymetri": gebco,
            "Norgeskart": kartverketTopo,
            "Norgeskart (gråtone)": kartverketGraatone,
        };

        // Farge per farkost og år — matcher GeoServer SLD-stilene
        var vehicleConfig = {
            'auv_fridtjof': {
                label: 'lauv-fridtjof',
                yearColors: { 2017: '#b3d9ff', 2018: '#66aaff', 2019: '#2277cc', 2021: '#1166bb', 2022: '#0044aa', 2023: '#002266', 2024: '#001144' }
            },
            'auv_Harald': {
                label: 'lauv-Harald',
                yearColors: { 2017: '#ffdd88', 2018: '#ff8833', 2019: '#cc3300', 2021: '#881100' }
            },
            'auv_roald': {
                label: 'lauv-roald',
                yearColors: { 2022: '#00cc66', 2024: '#007744', 2025: '#004422' }
            },
            'auv_thor': {
                label: 'lauv-thor',
                yearColors: { 2021: '#cc88ff', 2023: '#aa44ff' }
            },
            'auv_marie': {
                label: 'lauv-marie',
                yearColors: { 2025: '#00cccc' }
            }
        };

        function dot(color) {
            return '<span style="display:inline-block;width:10px;height:10px;' +
                   'border-radius:50%;background:' + color + ';' +
                   'margin-right:5px;vertical-align:middle"></span>';
        }

        L.control.scale({ imperial: false }).addTo(map);

        function addGroupToggles(control) {
            control.getContainer()
                .querySelectorAll('.leaflet-control-layers-group')
                .forEach(function(group) {
                    var label = group.querySelector('.leaflet-control-layers-group-label');
                    if (!label) return;

                    var sublayerEls = Array.from(group.children).filter(function(el) {
                        return el !== label;
                    });
                    if (sublayerEls.length === 0) return;

                    var arrow = document.createElement('span');
                    arrow.className = 'group-arrow';
                    arrow.textContent = ' ▼';
                    label.appendChild(arrow);

                    label.addEventListener('click', function(e) {
                        if (e.target.type === 'checkbox') return;
                        e.preventDefault();
                        e.stopPropagation();
                        var expanded = arrow.textContent.trim() === '▼';
                        sublayerEls.forEach(function(el) {
                            el.style.display = expanded ? 'none' : '';
                        });
                        arrow.textContent = expanded ? ' ▶' : ' ▼';
                    });
                });
        }

        function cfgKey(layerName) {
            return Object.keys(vehicleConfig).find(
                k => k.toLowerCase() === layerName.toLowerCase()
            );
        }

        fetch('/geoserver/rest/layers.json', {
            headers: { 'Authorization': 'Basic ' + btoa('admin:geoserver') }
        })
        .then(r => r.json())
        .then(data => {
            var geoLayers = (data.layers.layer || []).filter(l => {
                var name = l.name.split(':')[1] || l.name;
                return !!cfgKey(name);
            });

            var bboxFetches = geoLayers.map(layer =>
                fetch('/geoserver/rest/layers/' + layer.name + '.json', {
                    headers: { 'Authorization': 'Basic ' + btoa('admin:geoserver') }
                })
                .then(r => r.json())
                .then(d => fetch(d.layer.resource.href, {
                    headers: { 'Authorization': 'Basic ' + btoa('admin:geoserver') }
                }))
                .then(r => r.json())
            );

            return Promise.all(bboxFetches).then(details => ({ geoLayers, details }));
        })
        .then(({ geoLayers, details }) => {
            var groupedOverlays = {
                'Batymetri': { 'EMODnet': emodnetBathy }
            };

            var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

            geoLayers.forEach((layer, i) => {
                var parts     = layer.name.split(':');
                var workspace = parts[0];
                var layerName = parts[1] || parts[0];
                var cfg       = vehicleConfig[cfgKey(layerName)];

                var groupLabel = dot(Object.values(cfg.yearColors)[0]) + '<b>' + cfg.label + '</b>';
                groupedOverlays[groupLabel] = {};

                Object.entries(cfg.yearColors).forEach(([year, color]) => {
                    groupedOverlays[groupLabel][dot(color) + year] = L.tileLayer.wms(
                        '/geoserver/' + workspace + '/wms', {
                            layers:      layerName,
                            format:      'image/png',
                            transparent: true,
                            attribution: 'NTNU ROV/AUV GIS',
                            CQL_FILTER:  'year=' + year
                        }
                    );
                });

                var bb = details[i]?.featureType?.latLonBoundingBox;
                if (bb) {
                    minX = Math.min(minX, bb.minx); maxX = Math.max(maxX, bb.maxx);
                    minY = Math.min(minY, bb.miny); maxY = Math.max(maxY, bb.maxy);
                }
            });

            var layerControl = L.control.groupedLayers(baseMaps, groupedOverlays, {
                collapsed: false,
                groupCheckboxes: true
            }).addTo(map);

            addGroupToggles(layerControl);

            if (isFinite(minX)) {
                map.fitBounds([[minY, minX], [maxY, maxX]], { padding: [20, 20] });
            }
        })
        .catch(err => console.warn('Kunne ikke hente GeoServer-lag:', err));
    </script>

    <!-- Søkepanel -->
    <script>
        var GS_AUTH = 'Basic ' + btoa('admin:geoserver');
        var drawnItems = new L.FeatureGroup().addTo(map);
        var currentBounds = null;
        var searchResults = [];

        function showSearchError(msg) {
            var resDiv = document.getElementById('search-results');
            resDiv.style.display = 'block';
            document.getElementById('result-count').textContent = '⚠ ' + msg;
            document.getElementById('result-list').innerHTML = '';
            document.getElementById('btn-export').style.display = 'none';
        }

        // Toggle panel
        var panel  = document.getElementById('search-panel');
        var toggle = document.getElementById('search-toggle');
        toggle.addEventListener('click', function() {
            var open = panel.style.display === 'block';
            panel.style.display = open ? 'none' : 'block';
            toggle.textContent  = 'Søk i tokter ' + (open ? '▼' : '▲');
        });

        // Leaflet.draw — kun rektangel
        var drawControl = new L.Control.Draw({
            draw: {
                rectangle: { shapeOptions: { color: '#e63946', weight: 2, fillOpacity: 0.05 } },
                polygon: false, circle: false, circlemarker: false,
                marker: false, polyline: false
            },
            edit: false
        });
        map.addControl(drawControl);

        document.getElementById('btn-draw').addEventListener('click', function() {
            new L.Draw.Rectangle(map, drawControl.options.draw.rectangle).enable();
        });

        map.on('draw:created', function(e) {
            drawnItems.clearLayers();
            drawnItems.addLayer(e.layer);
            currentBounds = e.layer.getBounds();
            var bb = currentBounds;
            document.getElementById('rect-status').textContent =
                bb.getWest().toFixed(3) + '°Ø, ' + bb.getSouth().toFixed(3) + '°N  →  ' +
                bb.getEast().toFixed(3) + '°Ø, ' + bb.getNorth().toFixed(3) + '°N';
            console.log('[søk] rektangel satt:', currentBounds.toBBoxString());
        });

        document.getElementById('btn-clear-rect').addEventListener('click', clearRect);

        function clearRect() {
            drawnItems.clearLayers();
            currentBounds = null;
            document.getElementById('rect-status').textContent = 'Ingen rektangel tegnet';
        }

        document.getElementById('btn-clear-all').addEventListener('click', function() {
            clearRect();
            document.getElementById('date-from').value = '';
            document.getElementById('date-to').value   = '';
            document.getElementById('search-results').style.display = 'none';
            searchResults = [];
        });

        // Søk
        document.getElementById('btn-search').addEventListener('click', function() {
            var filters = [];

            if (currentBounds) {
                var b = currentBounds;
                filters.push(
                    'BBOX(geom,' + b.getWest() + ',' + b.getSouth() + ',' +
                    b.getEast() + ',' + b.getNorth() + ",'EPSG:4326')"
                );
            }
            var df = document.getElementById('date-from').value;
            var dt = document.getElementById('date-to').value;
            if (df) filters.push("end_time >= '" + df + "'");
            if (dt) filters.push("start_time <= '" + dt + "'");

            if (!filters.length) {
                showSearchError('Tegn et rektangel eller velg en datoperiode.');
                return;
            }

            var cql = filters.join(' AND ');
            var url = '/geoserver/NTNU/wfs?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature' +
                      '&TYPENAMES=NTNU:auv_missions&outputFormat=application/json&count=2000' +
                      '&CQL_FILTER=' + encodeURIComponent(cql);

            console.log('[søk] CQL_FILTER:', cql);
            console.log('[søk] URL:', url);

            var resDiv = document.getElementById('search-results');
            resDiv.style.display = 'block';
            document.getElementById('result-count').textContent = 'Søker…';
            document.getElementById('result-list').innerHTML    = '';
            document.getElementById('btn-export').style.display = 'none';

            // WFS er offentleg tilgjengeleg — ingen auth-header nødvendig
            fetch(url)
                .then(function(r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(function(data) {
                    if (data.exceptions) throw new Error(data.exceptions[0].text || 'GeoServer-feil');
                    searchResults = (data.features || [])
                        .map(function(f) { return f.properties; })
                        .sort(function(a, b) {
                            return (a.start_time || '') > (b.start_time || '') ? 1 : -1;
                        });
                    console.log('[søk] treff:', searchResults.length);
                    renderResults(searchResults);
                })
                .catch(function(err) {
                    console.error('[søk] feil:', err);
                    showSearchError(String(err));
                });
        });

        function renderResults(results) {
            var countEl  = document.getElementById('result-count');
            var listEl   = document.getElementById('result-list');
            var exportEl = document.getElementById('btn-export');

            if (!results.length) {
                countEl.textContent     = 'Ingen tokter funnet.';
                listEl.innerHTML        = '';
                exportEl.style.display  = 'none';
                return;
            }

            countEl.textContent    = results.length + ' tokter funnet';
            exportEl.style.display = '';

            listEl.innerHTML = results.map(function(r) {
                var date = (r.start_time || '').substring(0, 10);
                return '<div class="result-item">' +
                    '<strong>' + escHtml(r.name || '') + '</strong>' +
                    '<div class="meta">' +
                        escHtml(r.vehicle || '') + ' &bull; ' + date +
                        ' &bull; ' + (r.point_count || 0) + ' pkt' +
                    '</div>' +
                    '<div class="path">' + escHtml(r.source_path || '') + '</div>' +
                    '</div>';
            }).join('');
        }

        function escHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // CSV-eksport
        document.getElementById('btn-export').addEventListener('click', function() {
            if (!searchResults.length) return;
            var cols = ['name', 'vehicle', 'year', 'campaign',
                        'source_path', 'start_time', 'end_time', 'point_count'];
            var lines = [cols.join(',')];
            searchResults.forEach(function(r) {
                lines.push(cols.map(function(c) {
                    var v = (r[c] !== null && r[c] !== undefined) ? String(r[c]) : '';
                    return /[,"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
                }).join(','));
            });
            var blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
            var a    = Object.assign(document.createElement('a'), {
                href:     URL.createObjectURL(blob),
                download: 'tokter.csv'
            });
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });
    </script>
</body>
</html>
